<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-Site Shopping Search</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 500px;
            text-align: center;
        }

        h1 {
            color: #333;
            margin-bottom: 30px;
            font-size: 2.2em;
            font-weight: 700;
        }

        .search-section {
            margin-bottom: 30px;
        }

        .search-input {
            width: 100%;
            padding: 15px 20px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            font-size: 16px;
            transition: all 0.3s ease;
            outline: none;
            margin-bottom: 20px;
        }

        .search-input:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .button-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }

        .site-btn {
            padding: 12px 20px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            color: #333;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: relative;
        }

        .shopee { background: linear-gradient(135deg, #ffa8a8, #ffb3b3); }
        .momo { background: linear-gradient(135deg, #ffd4a3, #ffe0b3); }
        .pchome { background: linear-gradient(135deg, #a3d4ff, #b3e0ff); }
        .yahoo { background: linear-gradient(135deg, #d4a3ff, #e0b3ff); }
        .ruten { background: linear-gradient(135deg, #ffcba3, #ffd8b3); }
        .books { background: linear-gradient(135deg, #a3c4ff, #b3d0ff); }

        .site-checkbox {
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: #667eea;
        }

        .site-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
            border-color: #667eea;
        }

        .search-all-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
        }

        .search-all-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.3);
        }

        .search-all-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .note {
            margin-top: 20px;
            color: #666;
            font-size: 14px;
            font-style: italic;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🛍️ 台灣購物比價搜尋</h1>
        
        <div class="search-section">
            <input 
                type="text" 
                class="search-input" 
                id="searchTerm" 
                placeholder="輸入您要搜尋的商品..."
                onkeypress="handleKeyPress(event)"
            >
        </div>

        <div class="button-grid">
            <label class="site-btn shopee">
                <span>蝦皮購物</span>
                <input type="checkbox" class="site-checkbox" data-site="shopee">
            </label>
            <label class="site-btn momo">
                <span>momo購物</span>
                <input type="checkbox" class="site-checkbox" data-site="momo">
            </label>
            <label class="site-btn pchome">
                <span>PChome</span>
                <input type="checkbox" class="site-checkbox" data-site="pchome">
            </label>
            <label class="site-btn yahoo">
                <span>Yahoo購物</span>
                <input type="checkbox" class="site-checkbox" data-site="yahoo">
            </label>
            <label class="site-btn ruten">
                <span>露天拍賣</span>
                <input type="checkbox" class="site-checkbox" data-site="ruten">
            </label>
            <label class="site-btn books">
                <span>博客來</span>
                <input type="checkbox" class="site-checkbox" data-site="books">
            </label>
        </div>

        <button class="search-all-btn" onclick="searchSelectedSites()">
            搜尋選取的網站
        </button>

        <p class="note">
            勾選想要搜尋的網站，然後點擊搜尋按鈕。連結會在新分頁開啟。
        </p>
    </div>

    <script>
        const sites = {
            shopee: 'https://shopee.tw/search?keyword=',
            momo: 'https://www.momoshop.com.tw/search/searchShop.jsp?keyword=',
            pchome: 'https://ecshweb.pchome.com.tw/search/v3.3/?q=',
            yahoo: 'https://tw.buy.yahoo.com/search/product?p=',
            ruten: 'https://www.ruten.com.tw/find/?q=',
            books: 'https://search.books.com.tw/search/query/key/'
        };

        function getSearchTerm() {
            const term = document.getElementById('searchTerm').value.trim();
            if (!term) {
                alert('請輸入搜尋商品名稱！');
                return null;
            }
            return encodeURIComponent(term);
        }

        function searchSelectedSites() {
            const searchTerm = getSearchTerm();
            if (!searchTerm) return;

            const checkedBoxes = document.querySelectorAll('.site-checkbox:checked');
            
            if (checkedBoxes.length === 0) {
                alert('請至少選擇一個購物網站！');
                return;
            }

            checkedBoxes.forEach(checkbox => {
                const siteName = checkbox.getAttribute('data-site');
                const url = sites[siteName] + searchTerm;
                window.open(url, '_blank');
            });
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                searchSelectedSites();
            }
        }

        // Focus on input when page loads
        document.getElementById('searchTerm').focus();
    </script>
</body>
</html>
